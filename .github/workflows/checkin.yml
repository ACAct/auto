name: checkin

# ⚠️ 已关闭 schedule：福大 yzsxg.fzu.edu.cn 是校内域名，GitHub Actions 云端 runner
#   在外网永远连不上 → 留着 schedule 只会每晚 16 档全部失败、刷爆 Server酱推送。
#   改为只留 workflow_dispatch（手动触发）。本地签到由 Windows 任务计划兜底。
on:
  workflow_dispatch: {}   # 手动触发（已关闭 schedule，见上方说明）

# 原 schedule 排档（注释保留以便以后需要时恢复）：
# cron 是 UTC 时间，北京时间 = UTC + 8
#   - cron: "30 8 * * *"     # BJ 16:30
#   - cron: "0 9 * * *"      # BJ 17:00
#   - cron: "30 9 * * *"     # BJ 17:30
#   - cron: "0 10 * * *"     # BJ 18:00
#   - cron: "30 10 * * *"    # BJ 18:30
#   - cron: "0 11 * * *"     # BJ 19:00
#   - cron: "30 11 * * *"    # BJ 19:30
#   - cron: "0 12 * * *"     # BJ 20:00
#   - cron: "30 12 * * *"    # BJ 20:30
#   - cron: "0 13 * * *"     # BJ 21:00
#   - cron: "30 13 * * *"    # BJ 21:30
#   - cron: "0 14 * * *"     # BJ 22:00
#   - cron: "30 14 * * *"    # BJ 22:30
#   - cron: "0 15 * * *"     # BJ 23:00
#   - cron: "30 15 * * *"    # BJ 23:30
#   - cron: "55 15 * * *"    # BJ 23:55 末班

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — can runner reach yzsxg.fzu.edu.cn:443?
        run: |
          echo "=== DNS ==="
          getent hosts yzsxg.fzu.edu.cn || nslookup yzsxg.fzu.edu.cn || true
          echo "=== TCP 443 test ==="
          timeout 10 bash -c '</dev/tcp/yzsxg.fzu.edu.cn/443' && echo "✅ TCP 443 OK" || echo "❌ TCP 443 FAILED"
          echo "=== curl test ==="
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" --max-time 10 https://yzsxg.fzu.edu.cn/ || echo "❌ curl FAILED"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # 认证配置两种来源，优先级：CONFIG_YAML secret > 仓库内已提交的 config.yaml（私密库场景）
      # secret 内容 = 完整的 config.yaml，两种认证方式任选：
      #   1) user.token: "<免登token>"           （token 方式）
      #   2) user.username / user.password       （学号密码自动登录，token 留空）
      - name: Prepare config (secret overrides committed config)
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then
            echo "$CONFIG_YAML" > config.yaml
            echo "config from CONFIG_YAML secret"
          else
            test -s config.yaml && echo "config from committed config.yaml"
          fi

      - name: Run checkin
        run: python main.py
